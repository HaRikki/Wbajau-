# Render Blueprint — static site (no build step)
services:
  - type: web
    name: premium-bio
    runtime: static
    staticPublishPath: .
    buildCommand: echo "static site - nothing to build"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
